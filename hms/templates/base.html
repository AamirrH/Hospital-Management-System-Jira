<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Hospital Management System{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <a class="site-name" href="{{ url_for('index') }}">Hospital Management System</a>
        <nav aria-label="Main navigation">
            <a href="{{ url_for('register_patient') }}">Register Patient</a>
            <a href="{{ url_for('search_patient') }}">Search Patients</a>
            <a href="{{ url_for('book_appointment') }}">Book Appointment</a>
        </nav>
    </header>
    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
